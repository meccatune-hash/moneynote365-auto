name: MN365 Morning News

on:
  schedule:
    # 매일 07:10 KST (정각 몰림 큐 지연 방지를 위해 07:10분 설정 / UTC 22:10 전날)
    - cron: '10 22 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  morning-news:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Set WP_API_URL
        run: echo "WP_API_URL=${{ secrets.WP_URL }}/wp-json/wp/v2" >> $GITHUB_ENV
      - name: Run Global Morning News
        continue-on-error: true
        env:
          PYTHONUTF8: '1'
          WP_URL: ${{ secrets.WP_URL }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_PASSWORD: ${{ secrets.WP_PASSWORD }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python main_news.py
      - name: Run Politics, Entertainment, and Sports Morning News
        continue-on-error: true
        env:
          PYTHONUTF8: '1'
          WP_URL: ${{ secrets.WP_URL }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_PASSWORD: ${{ secrets.WP_PASSWORD }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python run_all_news.py --edition morning
