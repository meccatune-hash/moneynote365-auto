name: MN365 Morning News Briefing

on:
  # 매일 오전 7:00 KST = UTC 전날 22:00
  schedule:
    - cron: '0 22 * * 0-4'   # UTC 22:00 = KST 07:00 (월~금 아침)

  # 수동 실행 버튼
  workflow_dispatch:
    inputs:
      force_run:
        description: '강제 실행'
        required: false
        default: 'true'

jobs:
  morning-news:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Python 3.11 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 패키지 설치
        run: pip install -r requirements.txt

      - name: 모닝 뉴스 브리핑 실행
        env:
          PYTHONUTF8: 1
          WP_URL:       ${{ secrets.WP_URL }}
          WP_API_URL:   ${{ secrets.WP_URL }}/wp-json/wp/v2
          WP_USERNAME:  ${{ secrets.WP_USERNAME }}
          WP_PASSWORD:  ${{ secrets.WP_PASSWORD }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python main_news.py

      - name: 실행 결과 저장
        if: always()
        run: |
          echo "실행 완료: $(date '+%Y-%m-%d %H:%M KST')" >> news_run_log.txt

      - name: 로그 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: morning-news-log-${{ github.run_number }}
          path: news_run_log.txt
          retention-days: 7
