name: MN365 Entertainment News

on:
  schedule:
    # 매일 07:30 KST (아침 모닝 브리핑)
    - cron: '30 22 * * *'
    # 매일 18:30 KST (저녁 이브닝 결산 브리핑)
    - cron: '30 9 * * *'
  workflow_dispatch:

jobs:
  entertainment-news:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Set WP_API_URL
        run: echo "WP_API_URL=${{ secrets.WP_URL }}/wp-json/wp/v2" >> $GITHUB_ENV
      - name: Run entertainment news
        env:
          PYTHONUTF8: '1'
          WP_URL: ${{ secrets.WP_URL }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_PASSWORD: ${{ secrets.WP_PASSWORD }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python main_entertainment.py
